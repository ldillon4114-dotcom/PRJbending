<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Four Nations: Bending Scroll Archives</title>
<style>
:root{--parch:#ecdfbd;--parch2:#f6ecd2;--ink:#2b2118;--rule:#b39b64;--gold:#8a6d1f;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:
 repeating-linear-gradient(0deg, rgba(120,90,40,.035) 0 2px, transparent 2px 5px),
 radial-gradient(ellipse at 20% 0%, #f4e8ca, #e6d5ac 70%, #d9c495);
 color:var(--ink);font-family:Georgia,'Iowan Old Style','Times New Roman',serif;min-height:100vh;}
a{color:inherit;text-decoration:none;}
header{position:sticky;top:0;z-index:20;background:linear-gradient(#2a2016,#241b12);
 color:#eadfc4;padding:10px 14px 12px;box-shadow:0 3px 10px rgba(40,25,5,.35);}
header h1{margin:0;font-size:17px;letter-spacing:.12em;font-variant:small-caps;font-weight:normal;}
header .sub{font-size:11px;opacity:.75;letter-spacing:.2em;margin-top:2px;}
nav{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;align-items:center;}
nav a,nav button{background:rgba(240,220,170,.1);border:1px solid rgba(230,210,160,.35);color:#eadfc4;
 padding:6px 11px;border-radius:999px;font-size:12px;font-family:inherit;letter-spacing:.06em;cursor:pointer;}
nav a.on{background:#eadfc4;color:#241b12;}
nav input{flex:1;min-width:150px;background:rgba(240,220,170,.12);border:1px solid rgba(230,210,160,.35);
 color:#f5ecd6;padding:7px 12px;border-radius:999px;font-family:inherit;font-size:13px;outline:none;}
nav input::placeholder{color:rgba(240,220,170,.55);}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px;}
h2.group{font-variant:small-caps;letter-spacing:.14em;font-weight:normal;font-size:15px;
 border-bottom:1px solid var(--rule);padding-bottom:6px;margin:26px 0 14px;color:#54432c;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
.scroll{position:relative;display:block;background:linear-gradient(160deg,var(--parch2),var(--parch));
 border:1px solid var(--rule);border-radius:10px;padding:16px 16px 14px;box-shadow:0 2px 8px rgba(70,50,10,.18);
 transition:transform .15s ease, box-shadow .15s ease;}
.scroll:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(70,50,10,.28);}
.scroll:before,.scroll:after{content:'';position:absolute;left:0;right:0;height:7px;border-radius:8px;
 background:linear-gradient(#c9b283,#a68d58);opacity:.5;}
.scroll:before{top:-4px;}.scroll:after{bottom:-4px;}
.sym{display:inline-flex;width:44px;height:44px;border-radius:50%;align-items:center;justify-content:center;
 background:var(--acc);box-shadow:0 0 0 3px rgba(0,0,0,.08);}
.sym svg{width:26px;height:26px;fill:#fff;stroke:#fff;}
.scroll h3{margin:10px 0 4px;font-size:17px;font-variant:small-caps;letter-spacing:.08em;font-weight:normal;}
.scroll p{margin:0 0 10px;font-size:12.5px;line-height:1.5;opacity:.85;}
.meta{font-size:11px;letter-spacing:.08em;color:#6d5b3f;text-transform:uppercase;}
.bar{height:6px;background:rgba(90,70,30,.18);border-radius:4px;margin-top:7px;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px;}
.badge{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;
 border-radius:999px;margin-left:6px;vertical-align:middle;}
.b-canon{background:#6d5b3f;color:#f6ecd2;}
.b-rooted{background:#8a6d1f;color:#f6ecd2;}
.b-fan{background:#1c5c3f;color:#b9f4d6;}
.rel{font-size:12px;margin:6px 0 0;color:#54432c;font-style:italic;}
.banner{border-radius:12px;padding:22px 20px;box-shadow:0 4px 14px rgba(40,25,5,.3);margin-bottom:18px;}
.banner h2{margin:8px 0 6px;font-variant:small-caps;letter-spacing:.12em;font-weight:normal;font-size:24px;}
.banner p{margin:0;line-height:1.6;font-size:14.5px;}
.kindline{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;}
.note{background:rgba(138,109,31,.12);border-left:3px solid var(--gold);padding:10px 14px;margin:14px 0;
 font-size:12.5px;line-height:1.55;font-style:italic;}
.tier{margin:24px 0 10px;}
.tier h3{font-variant:small-caps;letter-spacing:.12em;font-weight:normal;font-size:15px;color:#54432c;
 border-bottom:1px dashed var(--rule);padding-bottom:5px;}
.trow{display:flex;align-items:center;gap:10px;padding:11px 6px;border-bottom:1px solid rgba(120,95,40,.25);cursor:pointer;}
.trow:hover{background:rgba(138,109,31,.08);}
.trow .tn{flex:1;font-size:15px;}
.chip{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.star{font-size:17px;color:#b0a077;cursor:pointer;user-select:none;}
.star.on{color:#c9a227;}
button.act{font-family:inherit;font-size:12px;letter-spacing:.06em;background:var(--parch2);
 border:1px solid var(--rule);border-radius:999px;padding:7px 13px;cursor:pointer;color:var(--ink);}
button.act.cur{background:#2b2118;color:#f2e6c8;}
.mask{position:fixed;inset:0;background:rgba(25,18,6,.68);display:flex;align-items:flex-start;justify-content:center;
 padding:26px 14px;z-index:50;overflow:auto;}
.sheet{background:linear-gradient(160deg,#f7eed6,#e9dcb8);border:1px solid #b39b64;border-radius:14px;
 max-width:600px;width:100%;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.5);}
.sheet h3{margin:0 0 2px;font-size:21px;font-variant:small-caps;letter-spacing:.1em;font-weight:normal;}
.sheet .fl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6d5b3f;margin:13px 0 3px;}
.sheet p{margin:0;font-size:14px;line-height:1.6;}
.sheet .close{float:right;background:none;border:1px solid var(--rule);border-radius:999px;padding:4px 12px;
 font-family:inherit;cursor:pointer;font-size:12px;color:var(--ink);}
.strow{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;}
.mrow{padding:8px 6px;border-bottom:1px solid rgba(120,95,40,.25);}
.mrow b{font-size:14px;font-weight:normal;font-variant:small-caps;letter-spacing:.06em;}
.mrow span{display:block;font-size:12.5px;opacity:.8;margin-top:2px;line-height:1.5;}
.statline{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#6d5b3f;margin-top:5px;}
svg.diag{width:100%;height:auto;display:block;background:rgba(246,236,210,.5);border:1px solid var(--rule);
 border-radius:12px;}
svg.diag text{font-family:Georgia,serif;}
footer{margin-top:40px;font-size:11.5px;color:#6d5b3f;text-align:center;line-height:1.6;font-style:italic;padding:0 14px;}
.back{display:inline-block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6d5b3f;margin-bottom:12px;}
.rsec{margin:18px 0;}
.rsec h4{margin:0 0 6px;font-variant:small-caps;letter-spacing:.12em;font-weight:normal;font-size:14px;color:#54432c;}
.rrow{padding:8px 6px;border-bottom:1px solid rgba(120,95,40,.25);font-size:14px;}
.rrow small{display:block;color:#6d5b3f;font-size:11.5px;margin-top:2px;}
</style>
</head>
<body>

 <h1>The Four Nations: Bending Scroll Archives</h1>
 <div class="sub">a scroll-library of the bending arts</div>
 <nav>
  <a href="#home" data-nav="home">Home</a>

 </nav>

<script>
var DATA=[{"id":"water","name":"Waterbending","kind":"foundational","parent":null,"tagline":"The element of change, drawn from the moon and the tides.","about":"Waterbenders turn the flow of water into offense, defense, and healing. The art is patient and yielding: the bender reads the current, becomes part of it, and redirects it. Moonrise strengthens every form.","colors":{"bg":"#1d5c8a","ink":"#eaf4fa","accent":"#2a6f97","deep":"#123043"},"symbol":"<path d=\"M12 3c3.5 4.5 6 8 6 11a6 6 0 0 1-12 0c0-3 2.5-6.5 6-11z\"/>","history":"","techs":[{"id":"water-whip","name":"Water Whip","tier":"B","tag":"canon","desc":"The first form every student learns: water is drawn from any nearby source and snapped forward like a rope.","orig":"Traditional Southern Water Tribe forms, later refined in the Northern style.","pract":["Katara","Aang","Korra"],"fund":"Draw, shape, snap: the arm leads and the water follows without ever breaking flow.","move":"Wide circular arm sweeps ending in a sudden straightening of the wrist.","train":"Fill and empty a waterskin without spilling a drop, then snap the stream through hanging rings.","mastery":"Crack the whip through three moving targets without re-drawing from the source."},{"id":"water-bullets","name":"Pressurized Bullets","tier":"B","tag":"canon","desc":"Water is compressed into small pellets and fired in rapid bursts.","orig":"A combat drill common to both Water Tribe navies.","pract":["Korra","Katara"],"fund":"Compress first, fire second: pressure lives in the wrist, not the shoulder.","move":"Short jabbing pushes with two fingers, one pellet per beat.","train":"Strike sandbags at ten paces until the impacts land inside a hand-width circle.","mastery":"Land eight of ten pellets on a moving target."},{"id":"water-arms","name":"Water Arms","tier":"I","tag":"canon","desc":"Sustained limbs of water that grab, bind, block, and strike on their own.","orig":"Developed bymasterful benders who learned to hold shape without holding stance.","pract":["Ming-Hua","Korra","Katara"],"fund":"The water must keep moving or it falls: constant slow rotation holds the form.","move":"Shoulder and elbow movements mirror an extra pair of arms.","train":"Hold a ball of water aloft for five minutes, then learn to pass it hand to hand.","mastery":"Carry and set down two objects at once using water arms alone."},{"id":"healing","name":"Healing","tier":"I","tag":"canon","desc":"Directing one’s own energy through water over a wound to speed the body’s mending.","orig":"A sacred practice of the Northern Water Tribe, taught with the blessing of the spirits.","pract":["Katara","Kya","Aang"],"fund":"Gentle spirals over the injury, the bender breathing in rhythm with the patient.","move":"Two palms cupping water, tracing slow circles above the wound.","train":"Study the meridian charts of the healers’ lodge before touching a patient.","mastery":"Mend a deep cut cleanly, without leaving the water clouded."},{"id":"fog-vapor","name":"Fog and Vapor","tier":"I","tag":"canon","desc":"Water is unraveled into mist to blind, conceal, and disorient.","orig":"Swamp-bender improvisation, carried north by travelers.","pract":["Katara","Huu"],"fund":"Heat the water with intent, then let it scatter wide and slow.","move":"Opening palm motions, as if unrolling a great cloth.","train":"Fill a training yard with mist thick enough to hide a walking partner.","mastery":"Track an opponent by sound alone inside your own fog."},{"id":"plant-bending","name":"Plantbending","tier":"A","tag":"canon","desc":"Bending the water inside vines, roots, and blooms to move living growth.","orig":"The Foggy Swamp Tribe, who learned to feel the water in all living things.","pract":["Huu","The Foggy Swamp Tribe"],"fund":"See the water inside the plant as the same water you would bend from a stream.","move":"Slow beckoning gestures, coaxing rather than commanding.","train":"Spend a season among the roots until the swamp feels like one body of water.","mastery":"Weave a vine bridge across a river and hold it under weight."},{"id":"water-spout","name":"Water Spout","tier":"A","tag":"canon","desc":"The bender rises inside a towering spiral column of water.","orig":"A signature of the Avatar and the strongest masters.","pract":["Korra","Katara","Aang"],"fund":"The spiral must be fed from below while the top stays smooth.","move":"One arm raised, the other sweeping low, both turning with the column.","train":"Build the spiral from a pond until it lifts you clear of the shore.","mastery":"Ride the spout across open water and set down softly."},{"id":"bloodbending","name":"Bloodbending","tier":"A","tag":"canon","desc":"Controlling the water inside a living body. A dark art, possible in full moonlight, outlawed across the nations.","orig":"Discovered by the prisoner Hama during the Fire Nation raids; refined by the Yakone bloodline.","pract":["Hama","Katara","Yakone","Amon"],"fund":"Feel the tide inside the body, then pull it as the moon pulls the sea.","move":"A single slow clench of the fist, fingers curling like a closing tide.","train":"None. This technique is recorded here for study only, not for practice.","mastery":"The archives list no honorable mastery. It is a road most never return from."}],"masters":[{"name":"Katara","note":"Master waterbender of the Southern Water Tribe; the last southern student and later the greatest healer of her age.","tag":"canon"},{"name":"Korra","note":"The Avatar; direct, forceful style learned from the White Lotus.","tag":"canon"},{"name":"Hama","note":"Southern raider survivor; first to bend the water in living bodies.","tag":"canon"}]},{"id":"earth","name":"Earthbending","kind":"foundational","parent":null,"tagline":"The element of substance: patient, immovable, waiting beneath every footstep.","about":"Earthbenders do not push stone, they receive it and send it on. The art waits, roots through the stance, and strikes once, decisively. The badgermoles were its first teachers.","colors":{"bg":"#5a5e3a","ink":"#f2efe3","accent":"#6b705c","deep":"#2c2a1e"},"symbol":"<path d=\"M3 18l5-9 4 6 3-4 6 7H3z\"/>","history":"","techs":[{"id":"rock-throw","name":"Rock Throw","tier":"B","tag":"canon","desc":"A stone is levered from the ground and hurled with the whole body behind it.","orig":"The oldest recorded earthbending form, drawn from badgermole movements.","pract":["Toph Beifong","Korra","Bolin"],"fund":"Root the stance, load the leg, release through the hip.","move":"Stomp, twist, and extend one open palm.","train":"Break a boulder into throwing stones, then hit the same post fifty times.","mastery":"Place a stone inside a shield-sized target at twenty paces."},{"id":"earth-wall","name":"Earth Wall","tier":"B","tag":"canon","desc":"The ground itself is raised into a shield of packed stone.","orig":"Foundation defense of every Earth Kingdom army.","pract":["Toph Beifong","Haru","Kuvira"],"fund":"The wall rises from your own rooted stance; you cannot build what you do not stand on.","move":"Both hands rising as if lifting the ground’s edge.","train":"Raise a wall hip-high in one breath, then waist-high in the same breath.","mastery":"Raise and brace a wall against a charging partner without it cracking."},{"id":"earth-armor","name":"Earth Armor","tier":"I","tag":"canon","desc":"Stone and crystal wrap the body as plate armor moved by the bender’s own bending.","orig":"Favored by law enforcement and generals alike.","pract":["Toph Beifong","Kuvira","Kuvira"],"fund":"The armor is not worn, it is carried: the bender bends it from within.","move":"Rolling shoulder and hip motions that keep the plates riding with the body.","train":"Plate yourself in under ten seconds, then run an obstacle course armored.","mastery":"Fight a full sparring match with the armor answering every movement."},{"id":"seismic-sense","name":"Seismic Sense","tier":"I","tag":"canon","desc":"Reading vibrations through the ground to perceive the world blind: footsteps, heartbeats, lies.","orig":"Taught to the blind master Toph by the badgermoles.","pract":["Toph Beifong","Aang"],"fund":"Be still. The ground speaks to those who are not talking over it.","move":"Bare feet planted, weight dropping through the heels.","train":"Stand rooted and name every creature crossing a courtyard.","mastery":"Identify a friend by their heartbeat alone."},{"id":"tunneling","name":"Tunneling","tier":"I","tag":"canon","desc":"Earth opens ahead of the bender and closes behind, leaving no passage.","orig":"Traditional escape craft of Earth Kingdom refugees.","pract":["Toph Beifong","Haru"],"fund":"Part the stone like water: force applied at the seams, not the face.","move":"Sweeping two-handed gestures, like parting heavy curtains.","train":"Bore a tunnel ten body-lengths that seals itself behind you.","mastery":"Dig, travel, and surface precisely at a marked spot, in silence."},{"id":"sandbending","name":"Sandbending","tier":"I","tag":"canon","desc":"Loose sand is bent as a fluid current, sculpted and ridden like water.","orig":"The sandbender tribes of the Si Wong Desert.","pract":["The Sandbenders","Ghazan"],"fund":"Treat the sand as a million small stones agreeing on one direction.","move":"Wide flowing arm currents, weight shifting like a sailor’s.","train":"Sculpt a likeness from a dune, then unmake it with a breath of motion.","mastery":"Ride a sand current at full sprint and stop on a copper coin."},{"id":"shockwave","name":"Earth Shockwave","tier":"A","tag":"canon","desc":"Force driven into the ground erupts outward as a ring that unbalances everything standing.","orig":"A battlefield art refined during the Hundred Year War sieges.","pract":["Toph Beifong","Kuvira"],"fund":"All the body’s weight through one heel, one instant.","move":"A single full-body stomp, everything behind it.","train":"Drop from a height and turn the landing into a ring that topples ten dummies.","mastery":"Shake only the ground under your opponent, and nothing else."},{"id":"lavabending","name":"Lavabending","tier":"A","tag":"canon","desc":"Phase-shifting stone into molten rock and back. Among the rarest of all earth arts.","orig":"Known to a handful across history, including the Avatar Kyoshi line and Ghazan.","pract":["Ghazan","Bolin","Avatar Kyoshi"],"fund":"Hold two states of the same stone in mind at once and choose which becomes real.","move":"Kneading two-fist motions, as if working heat into bread.","train":"Melt a pebble, cool it, melt it again, until neither state surprises you.","mastery":"Walk a lava flow as a moving river without letting a single drop harden on you."}],"masters":[{"name":"Toph Beifong","note":"The Blind Bandit; inventor of metalbending and the greatest seismic reader alive.","tag":"canon"},{"name":"Bolin","note":"Pro-bending star of the Fire Ferrets; one of the rare modern lavabenders.","tag":"canon"},{"name":"Kuvira","note":"The Great Uniter; a stylist of precise, controlling earth and metal.","tag":"canon"}]},{"id":"fire","name":"Firebending","kind":"foundational","parent":null,"tagline":"The element of power, born from breath and inner flame.","about":"Firebenders create fire from their own breath and spirit rather than commanding what is already there. Aggression is only the surface; the true art is breath control, balance, and the discipline to hold a flame steady. The dragons were its first teachers.","colors":{"bg":"#a2352a","ink":"#fdf3e7","accent":"#b23a2f","deep":"#3a1512"},"symbol":"<path d=\"M12 2c1 3 4 4 4 8a4 4 0 0 1-8 0c0-1 .5-2 .5-2S6 10 6 13a6 6 0 0 0 12 0c0-5-4-7-6-11z\"/>","history":"","techs":[{"id":"fire-blast","name":"Fire Blast","tier":"B","tag":"canon","desc":"The first form: breath becomes a jet or ball of flame thrown from the fists.","orig":"The foundation of all Fire Nation military forms.","pract":["Zuko","Korra","Mako"],"fund":"Power rises from the breath, not the arm: exhale as you strike.","move":"Punch from the hip with a sharp exhale, the other fist anchoring.","train":"Light a candle from across the room, then a lantern, then a brazier.","mastery":"Strike a target from ten paces without scorching your own sleeve."},{"id":"fire-daggers","name":"Fire Daggers","tier":"B","tag":"canon","desc":"Twin blades of flame shaped along the fingers for close, precise work.","orig":"Street combat form popularized in Republic City pro-bending.","pract":["Zuko","Mako"],"fund":"Shape before force: the blade exists only while the will stays steady.","move":"Fingers extended, elbows tucked, short stabbing arcs.","train":"Hold both blades for two minutes without them wavering.","mastery":"Cut through a hanging rope cleanly with a flame edge."},{"id":"wall-of-flames","name":"Wall of Flames","tier":"I","tag":"canon","desc":"A standing curtain of fire raised to block, herd, or conceal.","orig":"Siege defense of the Fire Nation, taught to centurions.","pract":["Iroh","Ozai"],"fund":"Feed the wall from a low line of heat along the ground.","move":"A wide two-armed sweep from the earth upward.","train":"Hold a wall chest-high for thirty seconds in still air.","mastery":"Keep the wall standing while walking its length."},{"id":"breath-of-fire","name":"Breath of Fire","tier":"I","tag":"canon","desc":"Warmth gathered in the chest and released as a continuous exhalation of flame or heat.","orig":"An inner form kept by the Sun Warriors and the sages.","pract":["Iroh","Zuko"],"fund":"The stomach drives it; the mouth merely releases it.","move":"Slow diaphragm breathing, hands stacked at the core.","train":"Warm a frozen pond edge by breath alone without boiling the water.","mastery":"Hold the breath of fire steady for one full minute."},{"id":"heat-regulation","name":"Heat Regulation","tier":"I","tag":"canon","desc":"Drawing heat into the body or pouring it out to warm, endure, or melt.","orig":"A quiet art known to few, including the old Fire Lord Sozin.","pract":["Sozin","Iroh"],"fund":"Feel the temperature as a current, then redirect it inward or outward.","move":"Palms open and still, eyes closed, no striking motion at all.","train":"Sit in winter snow comfortably warm for one hour.","mastery":"Melt a locked bolt with a sustained touch."},{"id":"fire-jets","name":"Fire Jets","tier":"A","tag":"canon","desc":"Flame vented from hands and feet to drive the body through the air.","orig":"An agility art of the Fire Nation royal line.","pract":["Azula","Zuko","Ozai"],"fund":"Balance the thrusts; the body is the keel between jets.","move":"Explosive exhales from palms and soles in rhythm.","train":"Leap a river with one sustained jet before attempting flight.","mastery":"Cross a training yard airborne, land moving, and keep going."},{"id":"blue-flame","name":"Blue Flame","tier":"A","tag":"canon","desc":"Fire burned so hot and so controlled it turns blue, precise as a scalpel.","orig":"A prodigy’s art; recorded in only one royal line.","pract":["Azula"],"fund":"Absolute control: the flame does only exactly what the mind commands.","move":"Tight, surgical gestures with two fingers.","train":"Practice candle-flame drills until the flame answers within a finger’s width.","mastery":"Strike a coin off a partner’s glove without touching the glove."},{"id":"combustion","name":"Combustion Bending","tier":"A","tag":"canon","desc":"Focusing chi through a third-eye point to detonate force at range. Rare, taxing, and dangerous to the user.","orig":"An assassin’s discipline, not a soldier’s.","pract":["Combustion Man","P’Li"],"fund":"Focus everything through one point until the world goes quiet.","move":"None visible: stillness before the strike.","train":"Learn to quiet the mind completely before touching the technique.","mastery":"Place a detonation inside a circle at forty paces, nothing outside it."}],"masters":[{"name":"Iroh","note":"The Dragon of the West; redirected the lightning art and reformed firebending’s soul.","tag":"canon"},{"name":"Zuko","note":"Fire Lord; learned from the Sun Warriors and the dragons themselves.","tag":"canon"},{"name":"Azula","note":"Prodigy of the blue flame; precision over power.","tag":"canon"}]},{"id":"air","name":"Airbending","kind":"foundational","parent":null,"tagline":"The element of freedom, carried on the breath of the sky bison.","about":"Airbenders deflect and evade rather than strike. The art values mobility, peace, and the refusal to take life; its greatest techniques come from stillness and play rather than force. The sky bison and the flying lemurs were its first teachers.","colors":{"bg":"#6e7f74","ink":"#f4f6ee","accent":"#7f8f83","deep":"#33392f"},"symbol":"<path d=\"M4 9c3-4 8-5 12-2 2 1.5 2 4-1 4 2 0 3 2 1 4-3 3-8 2-10-1-1-2 0-3 1-3-2 0-3-1-3-2z\"/>","history":"","techs":[{"id":"breath-control","name":"Breath Control","tier":"B","tag":"canon","desc":"The root of all airbending: the breath steadies the mind and feeds every form.","orig":"The first teaching of the Southern and Eastern Air Temples.","pract":["Aang","Tenzin","Gyatso"],"fund":"Breathe slowly enough that the mind stops hurrying.","move":"Seated, hands on the knees, spine tall.","train":"Sit through one full hour of guided breathing without moving.","mastery":"Keep the breath smooth through a full sparring session."},{"id":"air-blast","name":"Air Blast","tier":"B","tag":"canon","desc":"A pulse of compressed air thrown from the palms to push, deflect, or break.","orig":"The basic technique taught to every airbending child.","pract":["Aang","Tenzin","Jinora"],"fund":"The power is in the release of held breath, not in muscle.","move":"Both palms shove the air forward from the core.","train":"Blow out one candle from across the room, then a lantern.","mastery":"Push a training dummy back exactly one step, no more."},{"id":"air-scooter","name":"Air Scooter","tier":"B","tag":"canon","desc":"A spinning column of air ridden like a wheel under the bender’s feet.","orig":"A favorite of young monks, refined into travel by the Avatar.","pract":["Aang","Korra"],"fund":"Stay loose: the scooter carries you only while you stop fighting it.","move":"One foot circling as if stirring a great pot.","train":"Ride the scooter around a courtyard ten times without touching down.","mastery":"Turn, stop, and dismount from full speed without stumbling."},{"id":"air-bubble","name":"Air Bubble","tier":"I","tag":"canon","desc":"A skin of air held around the body that lets the bender breathe and see underwater.","orig":"Developed by temple monks crossing flooded valleys.","pract":["Aang","Katara"],"fund":"Push the water out and hold the boundary calm: the bubble is patience made visible.","move":"Hands describing a slow sphere around the head.","train":"Submerge in a barrel and hold the bubble for two minutes.","mastery":"Walk a lakebed across, breathing easily the whole way."},{"id":"gliding","name":"Air Gliding","tier":"I","tag":"canon","desc":"The glider staff and air currents carry the bender long distances through the sky.","orig":"The signature travel art of the Air Nomads.","pract":["Aang","Tenzin"],"fund":"Read the wind before fighting it: soar where the air wants to go.","move":"Staff arcs overhead, body leaning into the turn.","train":"Glide from a tower and land on a marked circle.","mastery":"Ride thermals for a full hour without touching the ground."},{"id":"air-sense","name":"Air Sense","tier":"I","tag":"canon","desc":"Feeling pressure shifts in the air to sense movement and intent behind you.","orig":"Taught with the airbending philosophy: awareness without fear.","pract":["Aang","Tenzin"],"fund":"Listen with the skin: the air touches you before anything else does.","move":"Stillness, eyes closed, palms slightly raised.","train":"Catch thrown leaves from behind until none surprise you.","mastery":"Dodge a blindfolded strike using air sense alone."},{"id":"tornado","name":"Air Tornado","tier":"A","tag":"canon","desc":"A rising vortex of wind that lifts debris and opponents off their footing.","orig":"A master’s defense, rarely taught outside the temples.","pract":["Aang","Zaheer"],"fund":"The spin feeds itself once started; the master only steers it.","move":"One arm raised turning overhead, the other sweeping the base.","train":"Spin a vortex strong enough to lift sand, then leaves, then a dummy.","mastery":"Hold the tornado still in place for a full minute."},{"id":"flight","name":"Weightless Flight","tier":"A","tag":"canon","desc":"True unassisted flight: letting go of every earthly tether so the air simply carries you.","orig":"Achieved only by the guru Laghima and, generations later, Zaheer.","pract":["Laghima","Zaheer"],"fund":"Detach. The art is not pushing the air, it is needing nothing.","move":"None. The body relaxes and rises.","train":"Seven years of philosophical detachment, according to the old poems.","mastery":"There is no drill. Either the earth lets go of you or it does not."}],"masters":[{"name":"Aang","note":"The last airbender and the Avatar; playfulness as technique.","tag":"canon"},{"name":"Tenzin","note":"Son of Aang; keeper of the airbending tradition for a new generation.","tag":"canon"},{"name":"Zaheer","note":"A prisoner of no nation who unlocked flight through the guru’s writings.","tag":"canon"}]},{"id":"ice","name":"Icebending","kind":"specialized","parent":"water","tagline":"A specialized discipline of Waterbending: water held still until it becomes ice.","about":"Where waterbending flows, icebending holds. Icebenders are waterbenders who learned to freeze their element mid-motion and command it as solid crystal: walls, bridges, armor, and blades of ice. The archives record it as its own formal discipline, grown out of the Water Tribe’s frozen seas.","colors":{"bg":"#2d7f9e","ink":"#eef7fa","accent":"#7fb8d4","deep":"#16333d"},"symbol":"<path d=\"M12 2v20M4 6l16 12M20 6L4 18M12 2l-3 4M12 2l3 4M12 22l-3-4M12 22l3-4\"/>","history":"The formal Ice discipline as a separate art is fan-created; the ice techniques themselves are rooted in canon waterbending, where waterbenders have always frozen water. Recorded here with that root acknowledged.","techs":[{"id":"stillwater-freeze","name":"Stillwater Freeze","tier":"B","tag":"rooted","desc":"Holding moving water still until it hardens: the first and last lesson of ice.","orig":"Polar Water Tribe technique, formalized by the archives.","pract":["Katara","Korra","Desna and Eska"],"fund":"Stop the flow in your mind first; the water follows your certainty.","move":"Palms flat and pressing downward, as if calming a surface.","train":"Freeze a full cup, thaw it, and freeze it again without cracks.","mastery":"Freeze a wave mid-crest and keep it frozen for ten breaths."},{"id":"ice-shards","name":"Ice Shards","tier":"B","tag":"rooted","desc":"Water flash-frozen into splinters and thrown as projectiles.","orig":"A hunting form of the frozen south.","pract":["Katara","Desna and Eska"],"fund":"Freeze into points, not blocks: the shard is born sharp.","move":"Flicking finger throws, three per breath.","train":"Shatter ten water droplets into needles against a wooden post.","mastery":"Pin a moving target’s sleeve to a wall with a single shard."},{"id":"ice-bridge","name":"Ice Bridge","tier":"I","tag":"rooted","desc":"A path of frozen water laid across open sea or air, built as the bender walks.","orig":"How Water Tribe travelers cross between ice floes.","pract":["Katara","Korra"],"fund":"Freeze behind and ahead of the feet in rhythm.","move":"Two hands sweeping a path forward, pace by pace.","train":"Bridge a pond, then a stream, then a river channel.","mastery":"Bridge open water fast enough to outrun something chasing you."},{"id":"ice-dome","name":"Ice Dome and Wall","tier":"I","tag":"rooted","desc":"Defense raised from frozen water: a wall to block, a dome to enclose.","orig":"Standard defensive doctrine of the Northern Water Tribe.","pract":["Katara","Desna and Eska"],"fund":"The wall is only water ordered differently: shape before strength.","move":"An upward lifting motion, then a closing push.","train":"Raise a wall thick enough to stop a thrown stone, then a dome around a partner.","mastery":"Catch a charging opponent inside the dome without harming them."},{"id":"icicle-rain","name":"Icicle Rain","tier":"A","tag":"fan","desc":"A score of icicles loosed overhead in a falling volley.","orig":"Archived from Water Tribe siege accounts.","pract":["Desna and Eska"],"fund":"Every icicle is launched at its own moment: think of a rain of separate decisions.","move":"Both arms sweeping down, fingers splayed.","train":"Suspend ten icicles in the air and release them one by one on command.","mastery":"Fall the volley around a partner without one shard touching them."},{"id":"ice-armor","name":"Ice Armor","tier":"A","tag":"fan","desc":"Ice shaped into plate over the body, lighter than stone and shed at will.","orig":"An archive formalization of northern battle dress.","pract":["Korra"],"fund":"The armor must flex with the bender or it becomes a coffin.","move":"Sweeping wraps around shoulders and limbs.","train":"Form gauntlets, then a breastplate, then full plate, each in under a breath.","mastery":"Spar fully armored and melt the armor away without soaking yourself."},{"id":"permafrost-grip","name":"Permafrost Grip","tier":"A","tag":"fan","desc":"Ice formed directly around wrists, ankles, or weapons as living restraints.","orig":"An arrest technique of Water Tribe constables.","pract":["Desna and Eska"],"fund":"Freeze from the inside of the hold outward, never squeezing.","move":"A slow closing of one fist, then the other.","train":"Restrain a wooden post, then a struggling sandbag on a rope.","mastery":"Hold a resisting partner completely still without bruising them."},{"id":"glacier-push","name":"Glacier Push","tier":"A","tag":"fan","desc":"Moving ice on a glacial scale: shifting frozen masses that dwarf the bender.","orig":"Recorded from the great sea-wall defenses of the North.","pract":["Katara"],"fund":"Work with the ice’s own weight: nudge, never wrestle.","move":"Whole-body leaning thrusts, feet driving into frozen ground.","train":"Drift an ice floe across a lake with sustained pressure.","mastery":"Open a ship channel through a frozen bay and close it behind you."}],"masters":[{"name":"Katara","note":"Waterbending master whose ice work stands at the root of this discipline.","tag":"canon"},{"name":"Desna and Eska","note":"Northern Water Tribe twins; precision ice in tandem.","tag":"canon"}]},{"id":"lightning","name":"Lightningbending","kind":"specialized","parent":"fire","tagline":"A specialized discipline of Firebending: fire sharpened into the cold fire of the storm.","about":"Lightning is not hot fire but separated energy: yin and yang pulled apart and released as a bolt. It demands perfect calm, perfect balance, and no emotion in the strike. The archives record it as its own discipline, grown from the firebending of the old royal line.","colors":{"bg":"#274a6d","ink":"#f2f4f8","accent":"#c9a227","deep":"#101c2b"},"symbol":"<path d=\"M13 2L5 14h5l-2 8 9-13h-5l1-7z\"/>","history":"Lightning generation and redirection are canon firebending arts. The extended bolt techniques marked fan-created are original to these archives.","techs":[{"id":"storm-attunement","name":"Storm Attunement","tier":"B","tag":"fan","desc":"The first practice: sitting with a gathering storm until the bender’s pulse matches the air.","orig":"An archived preparation form for the lightning discipline.","pract":["Sage Iroh line (recorded)"],"fund":"Become calm weather before becoming a bolt.","move":"Seated stillness, eyes closed, palms open to the sky.","train":"Sit through a storm without flinching at thunder.","mastery":"Keep the pulse level through thunder directly overhead."},{"id":"static-sense","name":"Static Sense","tier":"B","tag":"fan","desc":"Reading the charge in the air to sense storms, machines, and nearby benders.","orig":"An archived awareness form.","pract":["Sage Iroh line (recorded)"],"fund":"Feel the air’s hair rising and follow it to its source.","move":"Fingertips spread, reading the space like antennae.","train":"Detect a partner sneaking up through their body’s charge.","mastery":"Call a storm’s distance to within a minute of its strike."},{"id":"lightning-redirection","name":"Lightning Redirection","tier":"I","tag":"canon","desc":"Receiving a live bolt and guiding it through the body to release elsewhere, harmlessly.","orig":"Devised by Iroh from the study of waterbenders.","pract":["Iroh","Zuko","Aang","Korra"],"fund":"The bolt must move like water through you: no stopping, no gripping.","move":"A circular path: receive at one hand, guide through the belly, release from the other.","train":"Practice the path for months before ever receiving a bolt.","mastery":"Redirect a bolt into the sky without scorching your own path."},{"id":"cold-precision","name":"Cold-Blooded Precision","tier":"I","tag":"canon","desc":"The mental art beneath the bolt: striking without anger, hesitation, or mercy.","orig":"The royal firebending doctrine of the old line.","pract":["Azula","Ozai"],"fund":"Be still water wearing lightning: emotion bends the bolt astray.","move":"Stillness. The strike is decided before the body moves.","train":"Meditate on a single target until everything else disappears.","mastery":"Strike a marked point, asleep in focus, with the heartbeat unchanged."},{"id":"sky-bolt","name":"Sky Bolt","tier":"I","tag":"fan","desc":"A long-range bolt cast across open ground, guided to a distant mark.","orig":"Archived from storm-battle accounts.","pract":["Mako"],"fund":"Aim with the whole arm’s line, release without adjusting.","move":"One arm extended, fingers apart, the body a straight wire.","train":"Strike a distant drum in windless air, then in wind.","mastery":"Split a hanging rope at fifty paces."},{"id":"lightning-generation","name":"Lightning Generation","tier":"A","tag":"canon","desc":"Separating yin and yang energy and reuniting them as lightning. The cold fire itself.","orig":"Developed in secret by the royal line; Iroh was among its first masters.","pract":["Iroh","Azula","Mako","Ozai"],"fund":"Move the energy through a full circular path and let it snap back together.","move":"A slow two-handed circuit ending in a single pointing release.","train":"Months of the circular drill until the spark comes without strain.","mastery":"Generate, hold, and release on command, ten times without fatigue."},{"id":"voltage-palm","name":"Voltage Palm","tier":"A","tag":"fan","desc":"A touch-range discharge: the bolt shortened to the space between palm and target.","orig":"An archived close-combat form.","pract":["Mako"],"fund":"Keep the circuit short: less sky, more bite.","move":"An open palm snap at contact range.","train":"Arc between your own two palms without touching them.","mastery":"Stun a training dummy’s strike-pad from a hair’s distance."},{"id":"chain-arc","name":"Chain Arc","tier":"A","tag":"fan","desc":"A bolt that leaps between multiple grounded points before expending itself.","orig":"An archived field technique of storm squads.","pract":["Mako"],"fund":"Each jump costs force: count the targets before you fire.","move":"A sweeping sidearm cast, wrist loose.","train":"Arc a bolt across three metal posts in sequence.","mastery":"Chain four targets and end the bolt in the ground, never in a person."}],"masters":[{"name":"Iroh","note":"Devised redirection from the waterbenders; the gentlest master of the coldest art.","tag":"canon"},{"name":"Mako","note":"Republic City police officer; generates lightning under pressure.","tag":"canon"}]},{"id":"metal","name":"Metalbending","kind":"specialized","parent":"earth","tagline":"A specialized discipline of Earthbending, invented by Toph Beifong: earth hiding inside metal.","about":"Metalbending is not bending a new element. It is bending the small traces of earth that remain inside refined metal, holding them like tiny rock hands and moving the whole piece. Toph invented it in the metal cell she was imprisoned in, when the earth plates told her what the refined metal could not: that metal is only earth that has forgotten itself.","colors":{"bg":"#5f6b60","ink":"#f0f2ee","accent":"#8a6d3b","deep":"#23241f"},"symbol":"<path d=\"M12 3l7 4v10l-7 4-7-4V7z\"/>","history":"","techs":[{"id":"metal-sense","name":"Understanding Metal as Earth","tier":"B","tag":"canon","desc":"The first scroll: metal is not a separate element but refined earth, and the bender must learn to feel the stone still living inside it.","orig":"The founding teaching of Toph Beifong’s metalbending academy.","pract":["Toph Beifong"],"fund":"Touch the metal and look past its shine to the grit of earth inside it.","move":"Slow palm presses against bars, plates, and coins, searching for the grain.","train":"Sit with a block of raw iron every day until its earth traces feel like familiar ground.","mastery":"Sense the difference between raw ore, worked iron, and steel by touch alone."},{"id":"impurity-sight","name":"Sensing Earth Impurities","tier":"B","tag":"canon","desc":"Locating the microscopic impurities of earth within metal, which are what the bender actually grips.","orig":"Discovered by Toph Beifong when she could not bend the pure metal of her prison but could feel its impurities.","pract":["Toph Beifong","Suyin Beifong","Lin Beifong"],"fund":"The cleaner the metal, the harder the grip: know the impurity before you try to move it.","move":"Fingertips resting still, the mind sweeping the metal like a lantern.","train":"Blindfold-sense coins, pans, and locks until their impurity maps feel obvious.","mastery":"Say which objects can and cannot be bent, and be right."},{"id":"metal-nudge","name":"Simple Metal Manipulation","tier":"B","tag":"canon","desc":"Moving small, simple metal objects: bending a coin, a key, a bent bar.","orig":"First applied form of the Beifong Metalbending Academy.","pract":["Suyin Beifong","Kuvira"],"fund":"Grip the impurities and pull the whole shape along with them.","move":"Pinched-finger guiding gestures, small and patient.","train":"Bend a copper coin into a curve, then back flat, one hundred times.","mastery":"Shape a key to fit a lock on the first try."},{"id":"metal-cable","name":"Metal Cables and Restraints","tier":"I","tag":"canon","desc":"Coiled metal cables fired from the wrist to bind wrists, legs, and doors.","orig":"Standard equipment of Republic City’s metalbending police, founded by the Beifong line.","pract":["Lin Beifong","Suyin Beifong","Republic City metalbending police"],"fund":"The cable is a whip with a memory: send it, then tell it to close.","move":"Wrist-snap throws with a closing fist on return.","train":"Hit ten practice posts from across a courtyard without a miss.","mastery":"Bind a running suspect at the ankles, at speed, without bruising the bone."},{"id":"metal-wall","name":"Metal Walls and Barriers","tier":"I","tag":"canon","desc":"Raising plates of metal from the ground or bending a sheet upright into a shield.","orig":"Republic City defense doctrine.","pract":["Lin Beifong","Kuvira"],"fund":"The plate bends where the impurities allow: respect the grain.","move":"A rising double-palm push, then a bracing hold.","train":"Erect a barricade from a pile of sheets in under five seconds.","mastery":"Stop a charging rhino-drawn cart with a braced wall."},{"id":"metal-shaping","name":"Controlling Larger Objects","tier":"I","tag":"canon","desc":"Bending sizable metal constructs: doors, armored plates, cargo, and machines.","orig":"Industrial applications refined in Zaofu and Republic City.","pract":["Suyin Beifong","Kuvira"],"fund":"Divide the big piece in your mind into many small grips.","move":"Broad, both-hand shaping sweeps with steady pressure.","train":"Fold a flat sheet into a closed box with no seams left open.","mastery":"Assemble a metal scaffold piece by piece with no tools."},{"id":"precision-lock","name":"Precision Metal Control","tier":"I","tag":"canon","desc":"Fine work at small scale: picking locks, bending pins, writing with wire.","orig":"Advanced academy training for law enforcement.","pract":["Lin Beifong","Suyin Beifong"],"fund":"Slow down until the metal tells you where it wants to go.","move":"Two-finger tremor movements, barely visible.","train":"Open ten different locks blindfolded, one pin at a time.","mastery":"Bend a wire inside a sealed box through a maze without touching the walls."},{"id":"metal-armor","name":"Metal Armor and Movement","tier":"A","tag":"canon","desc":"Armor plates worn and driven by the bender’s own bending, moving with the body like a second skin.","orig":"The fighting style of Zaofu’s guard and the Beifong family.","pract":["Suyin Beifong","Kuvira","Lin Beifong"],"fund":"The armor must answer every step or it becomes a cage.","move":"Rolling shoulder and hip motions, plates riding the movement.","train":"Plate up in under three seconds, then run a full obstacle course.","mastery":"Spar a full match with the armor flexing perfectly through every move."},{"id":"cable-weaving","name":"Cable Weaving and Grappling","tier":"A","tag":"canon","desc":"Using multiple cables at once to swing, climb, catch, and traverse like a spider in steel.","orig":"Urban pursuit craft of the Republic City police.","pract":["Lin Beifong","Republic City metalbending police"],"fund":"Each cable is a limb; the mind must hold all of them at once.","move":"Cross-body throws and weighted pendulum swings.","train":"Cross a training yard on two cables without touching the ground.","mastery":"Sweep a room, catching three targets on three cables simultaneously."},{"id":"living-alloy","name":"Complex Metal Manipulation","tier":"A","tag":"canon","desc":"Bending many metal pieces in independent motion at the same time.","orig":"The mark of a Zaofu master.","pract":["Suyin Beifong","Toph Beifong"],"fund":"Stop thinking of pieces. Think of a swarm you are conducting.","move":"Orchestral hand motions, each finger a separate line.","train":"Keep ten coins orbiting your body in separate paths for one minute.","mastery":"Duel while a dozen fragments fight independently around you."},{"id":"fluid-metal","name":"High-Precision Fluid Control","tier":"A","tag":"canon","desc":"Bending metal to a near-liquid smoothness for seamless forms and ultra-fine control.","orig":"Rarest of the school: limited by how little earth remains in the most refined alloys.","pract":["Kuvira","Suyin Beifong"],"fund":"The purer the metal, the gentler the grip: force shatters what patience shapes.","move":"Slow continuous rotations, as if stirring mercury.","train":"Shape a perfect sphere from a hardened billet with no visible seam.","mastery":"Flow a bar of refined steel into a new form without a single crack."},{"id":"blade-storm","name":"Specialized Applications","tier":"A","tag":"canon","desc":"Combat mastery: blades, projectiles, and thrown plates working as a coordinated storm.","orig":"The battlefield expression of the whole discipline.","pract":["Kuvira","Lin Beifong"],"fund":"Every piece has a job; the storm is only your plan made visible.","move":"Wide commanding sweeps punctuated by pinpoint flicks.","train":"Keep six blades circling while striking a target with your hands free.","mastery":"Disarm, bind, and wall an opponent in one continuous sequence."}],"masters":[{"name":"Toph Beifong","note":"The inventor. Found the earth inside metal in a prison cell and turned it into an art.","tag":"canon"},{"name":"Suyin Beifong","note":"Founder of Zaofu, the city of metalbending artistry.","tag":"canon"},{"name":"Lin Beifong","note":"Chief of the Republic City metalbending police.","tag":"canon"},{"name":"Kuvira","note":"The Great Uniter; precise, commanding metal in war and politics.","tag":"canon"},{"name":"Aang","note":"The Avatar learned basic metalbending from Toph, though it never came easily.","tag":"canon"}]},{"id":"emerald","name":"Emeraldbending","kind":"ancient","parent":null,"tagline":"A rare, mysterious ancient art: the bending of emerald crystal itself.","about":"Emeraldbending is recorded in these archives as a rare and mysterious original discipline, not an established canonical Avatar ability. Its benders do not move stone or water but the crystalline lattice of emerald itself: growing, shaping, and shattering green fire frozen in stone. Everything in this archive beyond its earthbending kinship is fan-created lore.","colors":{"bg":"#123b2a","ink":"#e9fff3","accent":"#2fe08a","deep":"#0a241a"},"symbol":"<path d=\"M12 2l6 5-6 15-6-15z\"/>","history":"Every technique, character, and historical claim in this archive is fan-created material written for these archives. Emeraldbending is not a canonical Avatar bending art. Its kinship with Earthbending is thematic: emerald is a crystal born of the earth, and the archives treat it as a rare art cousin to earthbending.","techs":[{"id":"attunement","name":"Emerald Attunement","tier":"B","tag":"fan","desc":"The first scroll: holding raw emerald until the bender feels its lattice as an extension of their own body.","orig":"Fan-created. The Verdant Riddle says the first benders learned by sitting a full season with one stone.","pract":["Sage Viridian (fan-created)"],"fund":"Do not grip the gem. Listen to it until it seems to grip back.","move":"Both hands cradling the stone, thumbs tracing its faces.","train":"Sit with one raw emerald daily until its edges feel like your own knuckles.","mastery":"Describe a stone’s hidden fracture lines by feel alone."},{"id":"gem-sense","name":"Emerald Crystal Detection","tier":"B","tag":"fan","desc":"Sensing emerald nearby: in soil, in walls, in the jewelry of strangers.","orig":"Fan-created.","pract":["Master Ellwyn (fan-created)"],"fund":"Emerald hums a little differently than its cousins; learn its note.","move":"A slow open-palm sweep across the terrain.","train":"Find ten buried emerald chips in a sand-pit exercise.","mastery":"Detect a single hidden gem across a crowded market hall."},{"id":"shard-form","name":"Simple Emerald Formations","tier":"B","tag":"fan","desc":"Growing small emerald shards from a seed crystal, like frost forming in fast motion.","orig":"Fan-created.","pract":["Sage Viridian (fan-created)"],"fund":"Growth, not construction: the crystal does the growing, the bender chooses where.","move":"Fingertips drawing upward as if pulling green light out of the ground.","train":"Grow and dissolve a thumb-length shard one hundred times.","mastery":"Grow a matched pair of shards, identical to a jeweler’s eye."},{"id":"green-touch","name":"Basic Emerald Manipulation","tier":"B","tag":"fan","desc":"Levitating, turning, and directing loose emerald pieces through the air.","orig":"Fan-created.","pract":["Sage Viridian (fan-created)"],"fund":"The lattice carries your intent; hold it lightly.","move":"Gentle beckoning curls of the fingers.","train":"Thread a gem through a ring on a string, back and forth.","mastery":"Juggle three emerald shards without touching them."},{"id":"emerald-barrier","name":"Emerald Barriers and Shields","tier":"I","tag":"fan","desc":"Raising walls and interlocking shields of translucent green crystal.","orig":"Fan-created.","pract":["Master Ellwyn (fan-created)"],"fund":"A barrier is a lattice locked against itself: build the interlock, then push.","move":"A rising push followed by a slow locking twist of both wrists.","train":"Raise a shield that stops a thrown stone, then a hurled boulder.","mastery":"Hold a barrier under an earthbender’s full strike."},{"id":"emerald-darts","name":"Emerald Projectiles","tier":"I","tag":"fan","desc":"Condensed crystal darts thrown faster than any stone of the same size.","orig":"Fan-created.","pract":["Sage Viridian (fan-created)"],"fund":"Long crystal flies true: grow the dart inside the throw.","move":"A whip-thin flick of the wrist, the dart finishing its growth in flight.","train":"Strike a bell at ten paces with a single dart.","mastery":"Put three darts into a moving target, all inside a coin’s width."},{"id":"lattice-shaping","name":"Shaping Emerald Structures","tier":"I","tag":"fan","desc":"Growing stairs, columns, cages, and lattices of living emerald.","orig":"Fan-created.","pract":["Master Ellwyn (fan-created)"],"fund":"Architecture in crystal: plan the whole shape, then let it climb.","move":"Spiraling two-handed gestures, like winding thread onto a spool.","train":"Grow a staircase of six steps and climb it before it dissolves.","mastery":"Enclose a partner in a crystal lattice they cannot cut from inside."},{"id":"precision-cut","name":"Precision Emerald Control","tier":"I","tag":"fan","desc":"Faceting and cutting emerald with bending alone, to jeweler’s exactness.","orig":"Fan-created.","pract":["Sage Viridian (fan-created)"],"fund":"A cut crystal holds more power: precision is strength, not decoration.","move":"One finger tracing the plane to be cut, the other hand perfectly still.","train":"Cut a rough stone into a clean faceted gem without a wheel.","mastery":"Match a master jeweler’s cut so closely the two are confused by dealers."},{"id":"emerald-constructs","name":"Emerald Weapons and Constructs","tier":"A","tag":"fan","desc":"Growing complete tools of crystal: blades, staves, locks, and limbs of solid emerald.","orig":"Fan-created.","pract":["Master Ellwyn (fan-created)"],"fund":"A construct is a decision made solid; grow it whole or it grows crooked.","move":"Drawing shapes in the air with two fingers and meaning them completely.","train":"Grow and use each of the classic forms: blade, staff, shield, key.","mastery":"Replace a broken tool mid-use with a fresh construct, seamlessly."},{"id":"emerald-armor","name":"Emerald Armor","tier":"A","tag":"fan","desc":"Plating the body in faceted crystal that turns a blade and blazes green in firelight.","orig":"Fan-created.","pract":["Sage Viridian (fan-created)"],"fund":"The armor grows with the body or it shatters on the first step.","move":"A wrapping sweep from feet to shoulders, hands trailing the lattice.","train":"Plate a limb, then the torso, then the whole body, each seamless.","mastery":"Take a full strike on the chestplate without a single facet cracking."},{"id":"verdant-surge","name":"Large-Scale Emerald Formations","tier":"A","tag":"fan","desc":"Raising whole fields of emerald spires, walls, and pillars at once.","orig":"Fan-created.","pract":["Sage Viridian (fan-created)"],"fund":"Lead the growth wave and let the lattice carry itself outward.","move":"A wide rising gesture, both arms drawing a tide upward.","train":"Grow a ring of spires around a grove in a single breath.","mastery":"Raise a green hedge-maze across a valley, and later lower it without leaving a shard."},{"id":"masterwork-facet","name":"Masterwork Facet","tier":"A","tag":"fan","desc":"The master’s art: bending emerald so precisely that crystal, light, and will become one gesture.","orig":"Fan-created. The Verdant Riddle records only three masters who reached it.","pract":["Sage Viridian (fan-created)"],"fund":"When you no longer command the gem, the gem stops needing commands.","move":"A single slow movement, indistinguishable from stillness.","train":"Complete every prior scroll, then begin again from attunement.","mastery":"Cut a masterwork gem that outshines every jeweled thing in the room."}],"masters":[{"name":"Sage Viridian, the First Facet","note":"Fan-created founder of the art, remembered in the Verdant Riddle as the first to hear emerald sing.","tag":"fan"},{"name":"Master Ellwyn of the Jade Halls","note":"Fan-created keeper of the lost Jade Halls and the last recorded masterwork cutter.","tag":"fan"}]}];
var byId={},children={},PRACS=[];
DATA.forEach(function(d){byId[d.id]=d;if(d.parent){(children[d.parent]=children[d.parent]||[]).push(d.id);}});
var STATUS=['Not Started','Practicing','Learned','Mastered'];
var W=[0,.35,.7,1], CH=['#9b8f7a','#c98a2d','#3f7fbf','#b8860b'];
var KIND={foundational:'Foundational Element',specialized:'Specialized Discipline',ancient:'Unique Ancient Art'};
var TIER={B:'Beginner Scrolls',I:'Intermediate Scrolls',A:'Advanced Scrolls'};
var TIER1={B:'Beginner Scroll',I:'Intermediate Scroll',A:'Advanced Scroll'};
function load(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return{}}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var st=load('bend_status'),fv=load('bend_fav');
function stat(t){return st[t.id]||0}
function setStat(t,v){st[t.id]=v;save('bend_status',st);}
function toggleFav(t){if(fv[t.id]){delete fv[t.id]}else{fv[t.id]=1}save('bend_fav',fv);}
function favCount(){var n=0;for(var k in fv)n++;return n;}
function prog(d){var w=0;for(var i=0;i<d.techs.length;i++)w+=W[stat(d.techs[i])];return Math.round(100*w/d.techs.length);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function sym(d){return '<span class="sym" style="background:'+d.colors.accent+'"><svg viewBox="0 0 24 24">'+d.symbol+'</svg></span>';}
function tagB(t){var m={canon:['canon','b-canon'],rooted:['canon-rooted','b-rooted'],fan:['fan-created','b-fan']};var v=m[t]||m.canon;
 return '<span class="badge '+v[1]+'">'+v[0]+'</span>';}
function chip(t){return '<span class="chip" style="background:'+CH[stat(t)]+';color:#fff">'+STATUS[stat(t)]+'</span>';}
function star(t){return '<span class="star'+(fv[t.id]?' on':'')+'" data-fav="'+t.id+'">'+(fv[t.id]?'\u2605':'\u2606')+'</span>';}
function bar(d){return '<span class="meta">'+d.techs.length+' techniques &middot; '+prog(d)+'% mastered</span><div class="bar"><i style="width:'+prog(d)+'%"></i></div>';}
function card(d){return '<a class="scroll" href="#arch/'+d.id+'">'+sym(d)+'<h3>'+esc(d.name)+'</h3><p>'+esc(d.tagline)+'</p><div class="rel">'+esc(d.relNote)+'</div>'+bar(d)+'</a>';}
function openModal(d,t){
 curTech=t.id;openTech=t.id;
 var m=document.getElementById('modal');
 m.innerHTML='<div class="mask"><div class="sheet"><button class="close" onclick="closeModal()">Close</button>'+
 '<h3>'+esc(t.name)+'</h3><div class="statline">'+esc(d.name)+' &middot; '+TIER1[t.tier]+tagB(t.tag)+'</div>'+
 '<div class="fl">Description</div><p>'+esc(t.desc)+'</p>'+
 '<div class="fl">Origins</div><p>'+esc(t.orig)+'</p>'+
 '<div class="fl">Known Practitioners</div><p>'+t.pract.map(esc).join(', ')+'</p>'+
 '<div class="fl">Fundamentals</div><p>'+esc(t.fund)+'</p>'+
 '<div class="fl">Associated Movements</div><p>'+esc(t.move)+'</p>'+
 '<div class="fl">Training Concepts</div><p>'+esc(t.train)+'</p>'+
 '<div class="fl">Mastery Requirements</div><p>'+esc(t.mastery)+'</p>'+
 '<div class="fl">Your Mastery</div><div class="strow" data-t="'+t.id+'">'+STATUS.map(function(s,i){
  return '<button class="act'+(stat(t)===i?' cur':'')+'" data-st="'+i+'">'+s+'</button>';}).join('')+'</div>'+
 '<div class="strow"><button class="act" data-favm="'+t.id+'">'+(fv[t.id]?'\u2605 Favorited':'\u2606 Add to Favorites')+'</button></div>'+
 '</div></div>';
}
function closeModal(){document.getElementById('modal').innerHTML='';curTech=null;openTech=null;}
function findTech(id){var out=null;DATA.forEach(function(d){d.techs.forEach(function(t){if(t.id===id)out={d:d,t:t};});});return out;}
document.addEventListener('click',function(e){
 var s=e.target.closest('[data-st]');
 if(s&&curTech){setStatObj(curTech,parseInt(s.getAttribute('data-st'),10));return;}
 var f=e.target.closest('[data-fav]');
 if(f){var id=f.getAttribute('data-fav');var p=findTech(id);toggleFav(p.t);render();if(openTech===id)openModal(p.d,p.t);return;}
 var fm=e.target.closest('[data-favm]');
 if(fm){var id2=fm.getAttribute('data-favm');var p2=findTech(id2);toggleFav(p2.t);openModal(p2.d,p2.t);return;}
 var r=e.target.closest('.trow');
 if(r){var p3=findTech(r.getAttribute('data-t'));openModal(p3.d,p3.t);return;}
 var rr=e.target.closest('.rrow[data-t]');
 if(rr){var p4=findTech(rr.getAttribute('data-t'));openModal(p4.d,p4.t);return;}
 var x=e.target.closest('.mask');
 if(x&&e.target===x)closeModal();
});
function setStatObj(id,v){var p=findTech(id);st[id]=v;save('bend_status',st);openModal(p.d,p.t);render();}
var app=document.getElementById('app');
function group(title,ds){return '<h2 class="group">'+title+'</h2><div class="grid">'+ds.map(card).join('')+'</div>';}
function foot(){var f=document.getElementById('foot');
 f.innerHTML='Canon techniques and characters come from the Avatar world. Material marked <b>fan-created</b>, including all of Emeraldbending, is original lore written for these archives.<br>Adding a new discipline later is one new entry in the archive data; every feature follows automatically.';}
function homeView(){curTech=null;openTech=null;
 var f=DATA.filter(function(d){return d.kind==='foundational'});
 var s=DATA.filter(function(d){return d.kind==='specialized'});
 var a=DATA.filter(function(d){return d.kind==='ancient'});
 app.innerHTML='<div style="text-align:center;padding:18px 6px 4px">'+
 '<div style="font-variant:small-caps;letter-spacing:.2em;font-size:13px;color:#6d5b3f">the great library</div>'+
 '<div style="font-size:18px;margin-top:6px;line-height:1.55">Eight archives of the bending arts, kept as the old scrolls kept them: by discipline, by scroll, and by the long road to mastery.</div></div>'+
 '<div style="text-align:center;margin:8px 0 4px"><a href="#diagram" style="display:inline-block;font-family:inherit;font-size:13px;border:1px solid var(--rule);border-radius:999px;padding:9px 16px;background:rgba(246,236,210,.6)">Open the Relationship Diagram</a></div>'+
 group('Four Foundational Elements',f)+
 group('Specialized Bending Disciplines',s)+
 group('Unique Ancient Art',a)+
 '<div style="text-align:center;margin:22px 0"><a href="#tracker" style="display:inline-block;font-family:inherit;border:1px solid var(--rule);border-radius:999px;padding:9px 16px;background:rgba(246,236,210,.6);font-size:13px">Path to Mastery: all eight disciplines</a></div>';
 foot();}
function archView(id){curTech=null;openTech=null;var d=byId[id];if(!d){location.hash='#home';return;}
 var par=d.parent?byId[d.parent]:null;var kids=(children[id]||[]).map(function(c){return byId[c]});
 var rows=function(tl){var ts=d.techs.filter(function(t){return t.tier===tl});if(!ts.length)return '';
  return '<div class="tier"><h3>'+TIER[tl]+'</h3>'+ts.map(function(t){return '<div class="trow" data-t="'+t.id+'">'+
  '<span class="tn">'+esc(t.name)+tagB(t.tag)+'</span>'+chip(t)+star(t)+'</div>';}).join('')+'</div>';};
 var relLine='';
 if(par)relLine='A specialization of <a href="#arch/'+par.id+'" style="text-decoration:underline">'+esc(par.name)+'</a>.';
 if(kids.length)relLine+=(relLine?' ':'')+'Its teachings extend into '+(kids.map(function(k){return '<a href="#arch/'+k.id+'" style="text-decoration:underline">'+esc(k.name)+'</a>'}).join(', '))+'.';
 app.innerHTML='<a class="back" href="#home">&larr; back to the library</a>'+
 '<div class="banner" style="background:linear-gradient(150deg,'+d.colors.bg+','+d.colors.deep+');color:'+d.colors.ink+'">'+
 '<div class="kindline">'+KIND[d.kind]+'</div><h2>'+esc(d.name)+'</h2><p>'+esc(d.about)+'</p>'+
 (relLine?'<p style="margin-top:10px;font-size:13px">'+relLine+'</p>':'')+'</div>'+
 (d.history?'<div class="note">'+d.history+'</div>':'')+
 rows('B')+rows('I')+rows('A')+
 '<h2 class="group">Notable Practitioners</h2>'+d.masters.map(function(m){return '<div class="mrow"><b>'+esc(m.name)+tagB(m.tag)+'</b><span>'+esc(m.note)+'</span></div>';}).join('');
 foot();}
function diagramView(){curTech=null;openTech=null;
 function node(x,y,d,r){var rr=r||46;var sc=rr/12;
  return '<a href="#arch/'+d.id+'"><g transform="translate('+x+','+y+')">'+
  '<circle r="'+rr+'" fill="'+d.colors.bg+'" stroke="'+d.colors.accent+'" stroke-width="3"/>'+
  '<g transform="translate(-12, -12) scale('+sc.toFixed(2)+')" fill="#fff" stroke="#fff">'+d.symbol+'</g>'+
  '<text y="'+(rr+18)+'" text-anchor="middle" font-size="15" fill="#2b2118">'+esc(d.name)+'</text>'+
  '<text y="'+(rr+34)+'" text-anchor="middle" font-size="10" letter-spacing="2" fill="#6d5b3f">'+KIND[d.kind].toUpperCase()+'</text></g></a>';}
 app.innerHTML='<a class="back" href="#home">&larr; back to the library</a>'+
 '<h2 class="group">The Ancient Scroll Diagram</h2>'+
 '<p style="font-size:14px;line-height:1.6;max-width:640px">Four foundational elements hold the world. Three disciplines grew from them like branches from a trunk, and one ancient art stands apart. Tap any symbol to open its archive.</p>'+
 '<svg class="diag" viewBox="0 0 840 560">'+
 '<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6d5b3f"/></marker></defs>'+
 '<path d="M110 172 L110 238" stroke="#6d5b3f" stroke-width="2" marker-end="url(#ah)"/>'+
 '<path d="M310 172 L310 238" stroke="#6d5b3f" stroke-width="2" marker-end="url(#ah)"/>'+
 '<path d="M510 172 L510 238" stroke="#6d5b3f" stroke-width="2" marker-end="url(#ah)"/>'+
 '<text x="126" y="210" font-size="12" fill="#6d5b3f" font-style="italic">specialization of</text>'+
 '<path d="M660 330 C 520 380 420 380 356 340" stroke="#2fe08a" stroke-width="2" fill="none" stroke-dasharray="6 6" marker-end="url(#ah)"/>'+
 '<text x="470" y="402" font-size="12" fill="#1c5c3f" font-style="italic">kin to the minerals of the earth</text>'+
 node(110,110,byId.water)+node(310,110,byId.earth)+node(510,110,byId.fire)+node(710,110,byId.air)+
 node(110,300,byId.ice,42)+node(310,300,byId.metal,42)+node(510,300,byId.lightning,42)+
 '<g><circle cx="710" cy="300" r="50" fill="none" stroke="#2fe08a" stroke-width="2" stroke-dasharray="5 5"/>'+
 '<circle cx="710" cy="300" r="62" fill="none" stroke="#2fe08a" stroke-width="1" opacity=".5"/></g>'+
 node(710,300,byId.emerald,44)+
 '<text x="420" y="505" text-anchor="middle" font-size="13" fill="#6d5b3f" font-style="italic">the four roots, three branches, and one art apart</text>'+
 '</svg>';foot();}
function trackerView(){curTech=null;openTech=null;
 app.innerHTML='<a class="back" href="#home">&larr; back to the library</a>'+
 '<h2 class="group">Path to Mastery</h2>'+
 '<p style="font-size:13.5px;max-width:640px;line-height:1.6">Progress in each discipline is weighed from your own scrolls: practicing counts a little, learned more, and mastered in full. Mark techniques inside each archive; nothing here is hardcoded, it follows your scrolls.</p>'+
 DATA.map(function(d){var c=[0,0,0,0];d.techs.forEach(function(t){c[stat(t)]++});
  return '<div style="margin:14px 0"><a href="#arch/'+d.id+'" style="font-variant:small-caps;letter-spacing:.08em;font-size:16px">'+esc(d.name)+'</a>'+
  '<span class="meta" style="margin-left:8px">'+prog(d)+'% &middot; '+c[3]+' mastered / '+c[2]+' learned / '+c[1]+' practicing</span>'+
  '<div class="bar" style="height:9px"><i style="width:'+prog(d)+'%"></i></div></div>';}).join('');
 foot();}
function favView(){curTech=null;openTech=null;var any=false;var html='';
 DATA.forEach(function(d){var ts=d.techs.filter(function(t){return fv[t.id]});if(!ts.length)return;any=true;
  html+='<div class="rsec"><h4>'+esc(d.name)+'</h4>'+ts.map(function(t){return '<div class="rrow" style="cursor:pointer" data-t="'+t.id+'">'+esc(t.name)+tagB(t.tag)+chip(t)+'<small>'+esc(t.desc)+'</small></div>';}).join('')+'</div>';});
 app.innerHTML='<a class="back" href="#home">&larr; back to the library</a><h2 class="group">Favorites</h2>'+
 (any?html:'<p style="font-style:italic">No marked scrolls yet. Tap the star beside any technique in an archive.</p>');foot();}
function searchView(q){curTech=null;openTech=null;q=q.trim().toLowerCase();
 if(!q){render();return;}
 var disc=[],tech=[],chars=[],seenC={};
 DATA.forEach(function(d){var hit=d.name.toLowerCase().indexOf(q)>=0;var rel=[];
  if(!hit&&d.parent&&byId[d.parent].name.toLowerCase().indexOf(q)>=0)rel.push('a specialization of '+byId[d.parent].name+' (related to your search)');
  (children[d.id]||[]).forEach(function(c){if(!hit&&byId[c].name.toLowerCase().indexOf(q)>=0)rel.push('the parent art of '+byId[c].name+' (related to your search)');});
  if(hit){disc.push({d:d,rel:null});d.techs.forEach(function(t){if(t.name.toLowerCase().indexOf(q)>=0)tech.push({d:d,t:t});});}
  else if(rel.length)disc.push({d:d,rel:rel});
  if(!hit)d.techs.forEach(function(t){if(t.name.toLowerCase().indexOf(q)>=0)tech.push({d:d,t:t});});
  d.techs.forEach(function(t){t.pract.forEach(function(p){if(p.toLowerCase().indexOf(q)>=0&&!seenC[p+d.id]){seenC[p+d.id]=1;
   var mm=d.masters.filter(function(m){return m.name===p})[0];
   chars.push({d:d,name:p,where:mm?mm.note:('practitioner of '+t.name),tag:mm?mm.tag:t.tag});}});});
  d.masters.forEach(function(m){if(m.name.toLowerCase().indexOf(q)>=0&&!seenC[m.name+d.id]){seenC[m.name+d.id]=1;
   chars.push({d:d,name:m.name,where:m.note,tag:m.tag});}});
 });
 var sec=function(title,items,fn){return items.length?'<div class="rsec"><h4>'+title+'</h4>'+items.map(fn).join('')+'</div>':'';};
 app.innerHTML='<h2 class="group">Search: \u201C'+esc(q)+'\u201D</h2>'+
 sec('Disciplines',disc,function(r){return '<div class="rrow"><a href="#arch/'+r.d.id+'">'+esc(r.d.name)+tagB(r.d.kind==='ancient'?'fan':'canon')+'</a><small>'+(r.rel?esc(r.rel.join(' &middot; ')):esc(r.d.tagline))+'</small></div>';})+
 sec('Techniques',tech,function(r){return '<div class="rrow" style="cursor:pointer" data-t="'+r.t.id+'">'+esc(r.t.name)+' <span style="color:#6d5b3f;font-size:12px">('+esc(r.d.name)+', '+TIER1[r.t.tier]+')</span>'+tagB(r.t.tag)+chip(r.t)+'<small>'+esc(r.t.desc)+'</small></div>';})+
 sec('Characters',chars,function(r){return '<div class="rrow"><span>'+esc(r.name)+'</span> <span style="color:#6d5b3f;font-size:12px">'+esc(r.d.name)+'</span>'+tagB(r.tag)+'<small>'+esc(r.where)+'</small></div>';})+
 (!disc.length&&!tech.length&&!chars.length?'<p style="font-style:italic">The archives hold nothing under that name. Try a discipline, a technique, or a bender.</p>':'');
 foot();}
function render(){
 var h=location.hash||'#home';
 ['home','diagram','tracker','fav'].forEach(function(k){var n=document.querySelector('[data-nav="'+k+'"]');if(n)n.className=(h==='#'+k)?'on':'';});
 if(h.indexOf('#arch/')===0)archView(h.slice(6));
 else if(h==='#diagram')diagramView();
 else if(h==='#tracker')trackerView();
 else if(h==='#fav')favView();
 else homeView();
}
window.addEventListener('hashchange',function(){document.getElementById('q').value='';render();});
render();
document.getElementById('q').addEventListener('input',function(e){searchView(e.target.value);});
document.getElementById('q').addEventListener('keydown',function(e){if(e.key==='Escape'){e.target.value='';render();e.target.blur();}});
</script>
